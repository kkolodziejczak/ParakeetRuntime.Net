name: Build and Test

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and check the release build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        shell: pwsh
        run: dotnet test ParakeetRuntime.Net.slnx --configuration Release

      # Builds the same files a release signs, so a packaging break shows up on the pull request.
      - name: Build and check unsigned release files
        shell: pwsh
        run: |
          ./scripts/Build-Release.ps1 -Version 0.0.0
          ./scripts/Test-ReleaseArtifacts.ps1 -Version 0.0.0
